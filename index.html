
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriAI - เพิ่มมูลค่าสินค้าเกษตร</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f1;color:#203528}
header{background:#176b43;color:white;padding:24px 18px}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
main{max-width:850px;margin:22px auto;padding:0 14px}
.card{background:white;border-radius:16px;padding:19px;margin-bottom:16px;box-shadow:0 3px 14px #183b2410}
h2{font-size:20px;margin:0 0 14px}
label{display:block;font-weight:bold;margin:12px 0 7px}
input,textarea,button{font:inherit}
input[type=text],input[type=number],textarea{width:100%;padding:12px;border:1px solid #cbd8ce;border-radius:10px}
textarea{min-height:75px}
button{border:0;border-radius:11px;padding:13px 18px;background:#197447;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.primary{width:100%;margin-top:16px}
.muted{color:#66766b;font-size:14px;line-height:1.6}
#preview{max-width:100%;max-height:220px;display:none;margin-top:12px;border-radius:12px}
#status{margin-top:12px;color:#176b43;font-weight:bold}
.idea{border:1px solid #d5e1d7;border-radius:12px;padding:14px;margin:10px 0}
.idea.selected{border:2px solid #19804b;background:#f0faf3}
.idea label{display:flex;gap:10px;align-items:flex-start;margin:0}
.idea input{margin-top:5px}
.idea h3{margin:0 0 5px;font-size:17px}
.idea p{margin:5px 0;color:#5b6c60;font-size:14px}
.tag{display:inline-block;background:#e7f4e9;color:#176b43;border-radius:20px;padding:5px 9px;font-size:12px}
.detail li{margin:8px 0;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:#eef8f0;border-radius:12px;padding:14px;margin-top:12px}
.costrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0ed}
.hidden{display:none}
footer{text-align:center;color:#758278;padding:25px;font-size:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>🌱 AgriAI</h1>
<p>AI ผู้ช่วยเพิ่มมูลค่าสินค้าเกษตร</p>
</header>

<main>
<section class="card">
<h2>1. ใส่ข้อมูลวัตถุดิบ</h2>
<p class="muted">พิมพ์ชื่อสินค้าเกษตรหรืออัปโหลดรูปภาพ</p>
<label>ชื่อวัตถุดิบ</label>
<input id="material" type="text" placeholder="เช่น ไม้สัก กาแฟ มะม่วง ไข่ไก่">
<label>รายละเอียดเพิ่มเติม</label>
<textarea id="extra" placeholder="เช่น มีวัตถุดิบ 20 กิโลกรัม"></textarea>
<label>รูปภาพวัตถุดิบ</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview" alt="รูปวัตถุดิบ">
<button class="primary" id="analyzeBtn">🔍 วิเคราะห์และหาไอเดียผลิตภัณฑ์</button>
<div id="status"></div>
</section>

<section class="card hidden" id="ideasSection">
<h2>2. เลือกผลิตภัณฑ์ที่ต้องการ</h2>
<p class="muted">เลือก 1 จาก 4 ผลิตภัณฑ์ที่ AI คิดให้</p>
<div id="ideas"></div>
</section>

<section class="card hidden detail" id="detailSection">
<h2>3. วิธีการผลิต</h2>
<div id="detail"></div>
</section>

<section class="card hidden" id="calculatorSection">
<h2>4. คำนวณต้นทุนและกำไร</h2>
<div class="grid">
<div><label>ค่าวัตถุดิบรวม</label><input id="rawCost" type="number" min="0" value="0"></div>
<div><label>ค่าแรงรวม</label><input id="laborCost" type="number" min="0" value="0"></div>
<div><label>ค่าใช้จ่ายอื่น</label><input id="otherCost" type="number" min="0" value="0"></div>
<div><label>ค่าบรรจุภัณฑ์รวม</label><input id="packageCost" type="number" min="0" value="0"></div>
<div><label>จำนวนที่ผลิตได้ (ชิ้น)</label><input id="quantity" type="number" min="1" value="10"></div>
<div><label>ราคาขายต่อชิ้น</label><input id="sellPrice" type="number" min="0" value="0"></div>
</div>
<button class="primary" id="calculateBtn">คำนวณต้นทุนและกำไร</button>
<div class="result" id="calcResult">กรอกข้อมูลแล้วกดคำนวณ</div>
</section>
</main>
<footer>AgriAI · เพิ่มมูลค่าสินค้าเกษตร</footer>

<script>
const AI_URL = "ใส่_URL_WORKER_ของคุณ";
let imageData = null;
let currentIdeas = [];

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:2});

$("photo").addEventListener("change",e=>{
  const file=e.target.files[0];
  imageData=null;
  $("preview").style.display="none";
  if(!file)return;
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    alert("เลือกรูป JPG, PNG หรือ WEBP");
    e.target.value="";
    return;
  }
  if(file.size>5*1024*1024){
    alert("รูปต้องมีขนาดไม่เกิน 5 MB");
    e.target.value="";
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    imageData=reader.result;
    $("preview").src=imageData;
    $("preview").style.display="block";
  };
  reader.readAsDataURL(file);
});

$("analyzeBtn").addEventListener("click",analyze);
$("calculateBtn").addEventListener("click",calculate);

async function analyze(){
  const material=$("material").value.trim();
  const extra=$("extra").value.trim();

  if(!material&&!imageData){
    alert("กรุณาใส่ชื่อวัตถุดิบหรือรูปภาพ");
    return;
  }
  if(!AI_URL.startsWith("https://")){
    $("status").textContent="ยังไม่ได้เชื่อมต่อระบบ AI";
    return;
  }

  $("analyzeBtn").disabled=true;
  $("status").textContent="กำลังวิเคราะห์วัตถุดิบ...";
  $("ideasSection").classList.add("hidden");
  $("detailSection").classList.add("hidden");
  $("calculatorSection").classList.add("hidden");

  try{
    const response=await fetch(AI_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({material,extra,image:imageData})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"วิเคราะห์ไม่สำเร็จ");
    if(!Array.isArray(data.ideas)||data.ideas.length!==4)
      throw new Error("AI ส่งข้อมูลไม่ครบ 4 รายการ");

    currentIdeas=data.ideas;
    renderIdeas();
    $("ideasSection").classList.remove("hidden");
    $("status").textContent="วิเคราะห์สำเร็จ เลือกผลิตภัณฑ์ได้เลย";
  }catch(error){
    $("status").textContent="เกิดข้อผิดพลาด: "+error.message;
  }finally{
    $("analyzeBtn").disabled=false;
  }
}

function renderIdeas(){
  const box=$("ideas");
  box.replaceChildren();

  currentIdeas.forEach((idea,index)=>{
    const card=document.createElement("div");
    card.className="idea";

    const label=document.createElement("label");
    const radio=document.createElement("input");
    radio.type="radio";
    radio.name="product";
    radio.value=index;
    radio.addEventListener("change",()=>chooseProduct(index));

    const content=document.createElement("div");
    const title=document.createElement("h3");
    title.textContent=(index+1)+". "+idea.name;

    const reason=document.createElement("p");
    reason.textContent=idea.reason||"";

    const price=document.createElement("span");
    price.className="tag";
    price.textContent="ราคาขายแนะนำ "+money(idea.suggestedPrice)+" บาท/ชิ้น";

    content.append(title,reason,price);
    label.append(radio,content);
    card.append(label);
    box.append(card);
  });
}

function chooseProduct(index){
  const idea=currentIdeas[index];
  document.querySelectorAll(".idea").forEach((card,i)=>{
    card.classList.toggle("selected",i===index);
  });

  const box=$("detail");
  box.replaceChildren();

  addText(box,"h3",idea.name);
  addText(box,"p","เหตุผล: "+idea.reason);
  addList(box,"วัตถุดิบและอุปกรณ์",idea.materials);
  addList(box,"ขั้นตอนการผลิต",idea.steps);
  addList(box,"วิธีบรรจุภัณฑ์",idea.packagingSteps);

  const costs=idea.costs||{};
  $("rawCost").value=costs.rawMaterial||0;
  $("laborCost").value=costs.labor||0;
  $("otherCost").value=costs.other||0;
  $("packageCost").value=costs.packaging||0;
  $("quantity").value=idea.quantity||10;
  $("sellPrice").value=idea.suggestedPrice||0;

  $("detailSection").classList.remove("hidden");
  $("calculatorSection").classList.remove("hidden");
  calculate();
}

function addText(parent,tag,text){
  const node=document.createElement(tag);
  node.textContent=String(text||"");
  parent.append(node);
}

function addList(parent,title,items){
  addText(parent,"h3",title);
  const list=document.createElement("ol");
  (items||[]).forEach(item=>addText(list,"li",item));
  parent.append(list);
}

function calculate(){
  const raw=Number($("rawCost").value)||0;
  const labor=Number($("laborCost").value)||0;
  const other=Number($("otherCost").value)||0;
  const packaging=Number($("packageCost").value)||0;
  const quantity=Math.max(1,Number($("quantity").value)||1);
  const price=Number($("sellPrice").value)||0;

  const total=raw+labor+other+packaging;
  const unit=total/quantity;
  const revenue=price*quantity;
  const profit=revenue-total;

  const box=$("calcResult");
  box.replaceChildren();

  [
    ["ต้นทุนรวม",total],
    ["ต้นทุนต่อชิ้น",unit],
    ["ราคาขายต่อชิ้น",price],
    ["รายรับรวม",revenue],
    [profit>=0?"กำไรรวม":"ขาดทุนรวม",Math.abs(profit)],
    [profit>=0?"กำไรต่อชิ้น":"ขาดทุนต่อชิ้น",Math.abs(profit/quantity)]
  ].forEach(([label,value])=>{
    const row=document.createElement("div");
    row.className="costrow";
    addText(row,"span",label);
    addText(row,"strong",money(value)+" บาท");
    box.append(row);
  });
}
</script>
</body>
</html>
